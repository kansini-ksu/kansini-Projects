<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เอกสารอ้างอิง | การเปลี่ยนแปลงของเทคโนโลยี</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ซ่อนทั้งหน้าไว้ก่อน จนกว่าจะตรวจแล้วว่าล็อกอินอยู่ (กันคนเปิดไฟล์ตรงๆ เห็นเนื้อหา) */
  html:not(.ok) body{visibility:hidden}

  :root{
    /* โทนสีอิงจากหน้า index, situation2 และ decision1: เหลืองสด + หมึกเขียวเข้ม + ครีม */
    --ink:#20261c;
    --ink-soft:#666b5c;
    --y:#f4d24f;
    --y-hi:#f9e27a;
    --y-edge:#d1a922;
    --line:#ebe7d2;
    --card-edge:#e3dfc9;
    --glass:rgba(255,255,255,.76);
    --nav-w:292px;
    --pad:clamp(14px,2.4vw,28px);
    --ok:#2f7d45;
    --ok-bg:#eafaf1;
    --ok-edge:#256637;
    --danger:#c0392b;
    --danger-bg:#fdf0ed;
    --danger-edge:#962d22;
    --i-arrow:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%2320261c'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M5%2012h14'/%3E%3Cpath%20d='m12%205%207%207-7%207'/%3E%3C/svg%3E");
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Prompt","Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);min-height:100vh;
    background:#fbfaf2;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- พื้นหลัง (ชุดเดียวกับหน้า index และ situation2) ---------- */
  .bg{
    position:fixed;inset:0;z-index:-1;
    background:
      linear-gradient(180deg,rgba(252,251,244,.58) 0%,rgba(251,250,240,.62) 55%,rgba(255,249,224,.58) 100%),
      url("img/bg-science.png") center/cover no-repeat,
      linear-gradient(160deg,#fcfbf4 0%,#fbfaf0 55%,#fff7d6 100%);
    overflow:hidden;
  }

  /* ---------- โครงหน้า (หน้านี้ไม่มีเมนูข้าง: การ์ดอยู่กลางหน้า) ---------- */
  .shell{
    max-width:1040px;margin:0 auto;
    padding:max(var(--pad),env(safe-area-inset-top)) clamp(14px,3vw,32px) 40px;
  }
  .content{min-width:0}

  /* ---------- การ์ดหลัก (เอฟเฟกต์เดียวกับ situation2) ---------- */
  .panel{
    position:relative;isolation:isolate;overflow:hidden;
    border-radius:34px;border:2px solid transparent;
    padding:clamp(26px,4vw,52px) clamp(20px,4.4vw,60px) clamp(28px,4vw,48px);
    background:
      linear-gradient(160deg,#ffffff,#fffefa 55%,#fffbe6) padding-box,
      linear-gradient(135deg,#ffffff,#f3d65e 48%,#e6dfbb) border-box;
    box-shadow:0 8px 0 var(--card-edge),0 40px 70px -30px rgba(230,185,40,.65);
    animation:panelIn .9s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .panel[hidden]{display:none}
  @keyframes panelIn{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(12px)}}
  .panel>*{position:relative;z-index:1}
  .panel .corner{
    position:absolute;z-index:0;width:84px;height:84px;pointer-events:none;opacity:.9;
  }
  .panel .corner.tl{left:0;top:0;clip-path:polygon(0 0,100% 0,0 100%);background:linear-gradient(135deg,#fbe786,#f0c63a)}
  .panel .corner.br{right:0;bottom:0;clip-path:polygon(100% 100%,100% 0,0 100%);background:linear-gradient(135deg,#40463a,#1a1d15)}
  .panel::before{
    content:"";position:absolute;z-index:0;left:50%;top:-60px;width:420px;height:300px;margin-left:-210px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(244,210,79,.5),rgba(244,210,79,0) 70%);
    animation:corePulse 4s ease-in-out infinite;
  }
  @keyframes corePulse{50%{transform:scale(1.15)}}
  .panel::after{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(105deg,transparent 32%,rgba(244,210,79,.3) 48%,rgba(255,255,255,.85) 52%,transparent 68%);
    transform:translateX(-120%);animation:sheenX 1.3s 1s ease-in-out forwards,sheenLoop 7s 5s ease-in-out infinite;
  }
  @keyframes sheenX{to{transform:translateX(120%)}}
  @keyframes sheenLoop{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}

  /* ---------- หัวข้อหลักของการ์ด ---------- */
  .panel header{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
  .head-icon{
    width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 6px 0 var(--y-edge),0 20px 28px -10px rgba(190,150,20,.6),inset 0 2px 0 rgba(255,255,255,.6);
    transform:rotate(-6deg);animation:floaty 4.5s ease-in-out infinite;
  }
  .head-icon svg{width:40px;height:40px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
  .chip-lesson{
    display:inline-block;margin-bottom:14px;padding:6px 18px;border-radius:99px;
    font-weight:600;font-size:.88rem;background:#fff;border:2px solid #f0ecd6;box-shadow:0 3px 0 var(--card-edge);
  }
  .panel h1{
    font-family:"Prompt","Noto Sans Thai",sans-serif;
    font-size:clamp(2rem,5vw,3.2rem);font-weight:700;line-height:1.3;letter-spacing:-.3px;color:var(--ink);
    display:inline-block;padding:.02em .36em .1em;
    background:linear-gradient(180deg,#f9e27a,#f1cb43);border-radius:.3em;transform:rotate(-1.5deg);
    box-shadow:0 .09em 0 var(--y-edge),0 18px 26px -12px rgba(190,150,20,.6);
    animation:hlPop .8s .35s cubic-bezier(.34,1.5,.64,1) backwards;
  }
  @keyframes hlPop{from{transform:rotate(-6deg) scale(.6);opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}}
  .panel .bar{
    display:block;width:110px;height:9px;margin:16px auto 0;border-radius:99px;
    background:linear-gradient(180deg,#f9e27a,#f1cb43);box-shadow:0 3px 0 var(--y-edge);
    animation:barGrow .9s .5s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes barGrow{from{width:0;opacity:0}}
  .lead{
    display:block;width:fit-content;max-width:60ch;margin:22px auto 0;padding:8px 26px;border-radius:99px;
    font-size:clamp(1rem,2.2vw,1.15rem);font-weight:400;color:var(--ink-soft);text-align:center;
    background:rgba(255,255,255,.9);border:2px solid #f0ecd6;box-shadow:0 4px 0 var(--card-edge);
    animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) backwards;
  }

  /* ---------- บล็อกเนื้อหา & โจทย์การตัดสินใจ ---------- */
  .block{margin-top:clamp(30px,4.2vw,48px)}
  .bh{display:flex;align-items:center;gap:14px}
  .bh .bn{
    flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;
    background:linear-gradient(145deg,#fbe786,#efc83f);box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-6deg);
  }
  .bh h2{font-size:clamp(1.3rem,2.8vw,1.7rem);font-weight:700;line-height:1.35;color:var(--ink)}
  .hint{margin:8px 0 18px 60px;font-size:.95rem;color:var(--ink-soft)}
  @media (max-width:600px){.hint{margin-left:0}}

  .box{padding:clamp(18px,3vw,30px);border-radius:28px;background:#fff;border:2px solid #f0ecd6;box-shadow:0 6px 0 var(--card-edge)}
  .story{animation:rise .9s .3s cubic-bezier(.2,.8,.2,1) backwards}
  .story-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .story-head .si{
    flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-6deg);
  }
  .story-head .si svg{width:28px;height:28px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .story h3{font-size:clamp(1.15rem,2.4vw,1.4rem);font-weight:700;line-height:1.4;color:var(--ink)}
  .story p{max-width:68ch;font-size:clamp(1rem,2vw,1.06rem);line-height:1.85;color:var(--ink-soft)}
  .story p + p{margin-top:10px}
  .watch{
    margin-top:18px;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:22px;
    background:#fffbe8;border:2px solid #f3e49a;box-shadow:0 4px 0 #eadb8a;
  }
  .watch .wi{
    flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 3px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);
  }
  .watch .wi svg{width:21px;height:21px;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .watch p{margin-top:4px;color:var(--ink);font-size:1rem;line-height:1.75}

  /* ---------- ปุ่มควบคุมด้านล่าง ---------- */
  .actions{margin-top:clamp(28px,3.6vw,40px);display:flex;flex-wrap:wrap;justify-content:center;gap:16px;animation:rise .9s .55s cubic-bezier(.2,.8,.2,1) backwards}
  .btn,.btn-ghost{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-width:240px;height:56px;padding:0 30px;border-radius:22px;cursor:pointer;
    font-weight:700;font-size:1.02rem;text-decoration:none;
  }
  .btn{
    border:0;color:var(--ink);
    background:linear-gradient(180deg,#f9e27a,#f1cb43);
    box-shadow:0 6px 0 var(--y-edge),0 18px 28px -10px rgba(190,150,20,.65),inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s,filter .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--y-edge),0 24px 32px -10px rgba(190,150,20,.75),inset 0 2px 0 rgba(255,255,255,.65)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--y-edge),0 6px 12px -6px rgba(190,150,20,.6),inset 0 2px 0 rgba(255,255,255,.5)}
  .btn:disabled{cursor:wait;opacity:.8;transform:translateY(3px);box-shadow:0 3px 0 var(--y-edge)}
  .btn svg,.btn-ghost svg{width:19px;height:19px;flex:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}

  .btn-ghost{
    color:var(--ink);background:#fff;border:2px solid #f0ecd6;box-shadow:0 5px 0 var(--card-edge);
    transition:transform .15s,box-shadow .15s,background .2s,border-color .2s;
  }
  .btn-ghost:hover{background:#fffbe8;border-color:var(--y);transform:translateY(-2px);box-shadow:0 7px 0 var(--card-edge)}
  .btn-ghost:active{transform:translateY(4px);box-shadow:0 1px 0 var(--card-edge)}
  @media (max-width:600px){
    .actions{flex-direction:column-reverse;align-items:stretch}
    .actions .btn,.btn-ghost{min-width:0;width:100%}
  }

  /* ---------- แจ้งเตือนสั้นๆ (Toast) ---------- */
  .toast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;
    transform:translate(-50%,20px);opacity:0;pointer-events:none;
    max-width:min(92vw,420px);padding:12px 22px;border-radius:20px;text-align:center;font-size:.92rem;font-weight:500;
    background:#fff;border:1.5px solid var(--y);color:var(--ink);
    box-shadow:0 3px 0 var(--y-edge),0 18px 30px -14px rgba(70,80,20,.5);
    transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}


  /* ---------- หน้าเอกสารอ้างอิง ---------- */
  .lead{
    display:block;width:fit-content;max-width:60ch;margin:22px auto 0;padding:8px 26px;border-radius:99px;
    font-size:clamp(1rem,2.2vw,1.15rem);font-weight:400;color:var(--ink-soft);text-align:center;
    background:rgba(255,255,255,.9);border:2px solid #f0ecd6;box-shadow:0 4px 0 var(--card-edge);
    animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .ref-wrap{max-width:900px;margin:clamp(28px,4vw,44px) auto 0}

  /* การ์ดหนังสือเรียนหลัก */
  .book{
    display:flex;align-items:center;gap:clamp(16px,2.6vw,28px);
    padding:clamp(18px,2.6vw,28px);border-radius:30px;
    background:#fff;border:2px solid #f0ecd6;box-shadow:0 6px 0 var(--card-edge);
    animation:rise .9s .3s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .cover{
    flex:none;width:clamp(96px,13vw,124px);aspect-ratio:3/4.1;padding:5px;border-radius:18px;overflow:hidden;
    display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 5px 0 var(--y-edge),0 18px 26px -10px rgba(190,150,20,.6),inset 0 2px 0 rgba(255,255,255,.6);
    transform:rotate(-3deg);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .book:hover .cover{transform:rotate(0) translateY(-3px)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:13px;background:#fff}
  .book-info{flex:1;min-width:0}
  .book-info h2{font-size:clamp(1.15rem,2.5vw,1.45rem);font-weight:700;line-height:1.45;color:var(--ink)}
  .book-info .sub{margin-top:6px;font-weight:500;font-size:clamp(.94rem,1.8vw,1.04rem);line-height:1.6;color:var(--ink)}
  .book-info .org{
    display:inline-block;margin-top:10px;padding:5px 16px;border-radius:99px;
    font-size:.86rem;font-weight:600;line-height:1.5;color:var(--ink);
    background:#fffbe8;border:2px solid #f3e49a;
  }

  .btn-book,.btn-end{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;flex:none;
    height:56px;padding:0 30px;border:0;border-radius:22px;cursor:pointer;
    font-weight:700;font-size:1.02rem;color:var(--ink);
    background:linear-gradient(180deg,#f9e27a,#f1cb43);
    box-shadow:0 6px 0 var(--y-edge),0 18px 28px -10px rgba(190,150,20,.65),inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s;
  }
  .btn-book:hover,.btn-end:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--y-edge),0 24px 32px -10px rgba(190,150,20,.75),inset 0 2px 0 rgba(255,255,255,.65)}
  .btn-book:active,.btn-end:active{transform:translateY(5px);box-shadow:0 1px 0 var(--y-edge),0 6px 12px -6px rgba(190,150,20,.6),inset 0 2px 0 rgba(255,255,255,.5)}
  .btn-book svg,.btn-end svg{width:20px;height:20px;flex:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}

  /* แหล่งข้อมูลเพิ่มเติม */
  .more-title{
    display:flex;align-items:center;gap:14px;margin-top:clamp(30px,4.2vw,46px);
    font-size:clamp(1.3rem,2.8vw,1.65rem);font-weight:700;line-height:1.35;color:var(--ink);
  }
  .more-title svg{
    flex:none;width:46px;height:46px;padding:11px;border-radius:16px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;
    background:linear-gradient(145deg,#fbe786,#efc83f);box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-6deg);
  }
  .ref-list{margin-top:18px;display:grid;gap:14px;list-style:none;counter-reset:ref}
  .ref{
    counter-increment:ref;position:relative;padding:16px 20px 16px 76px;border-radius:24px;
    background:#fff;border:2px solid #f0ecd6;box-shadow:0 5px 0 var(--card-edge);
    transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s,background .18s;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .ref:nth-child(1){animation-delay:.45s}.ref:nth-child(2){animation-delay:.53s}.ref:nth-child(3){animation-delay:.61s}
  .ref:nth-child(4){animation-delay:.69s}.ref:nth-child(n+5){animation-delay:.75s}
  .ref:hover{transform:translateY(-3px);background:#fffbe8;border-color:var(--y);box-shadow:0 8px 0 var(--card-edge),0 20px 30px -16px rgba(190,150,20,.45)}
  .ref::before{
    content:counter(ref);position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
    font-weight:700;font-size:1.05rem;color:var(--ink);
    background:linear-gradient(145deg,#fbe786,#efc83f);box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-6deg);
  }
  .ref h3{font-size:1.02rem;font-weight:700;line-height:1.5;color:var(--ink)}
  .ref p{margin-top:4px;font-size:.95rem;line-height:1.75;color:var(--ink-soft);overflow-wrap:anywhere}
  .ref a.lnk{
    display:inline-block;margin-top:6px;font-size:.88rem;font-weight:500;color:var(--ink);
    text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:3px;text-underline-offset:4px;overflow-wrap:anywhere;
    transition:background .2s;border-radius:6px;
  }
  .ref a.lnk:hover{background:rgba(244,210,79,.35)}

  .foot{margin-top:clamp(30px,4.2vw,44px);padding-top:26px;border-top:2px dashed #eadf9e;text-align:center;animation:rise .9s .8s cubic-bezier(.2,.8,.2,1) backwards}
  .foot p{font-size:1.05rem;font-weight:500;color:var(--ink-soft);margin-bottom:16px}

  @media (max-width:700px){
    .book{flex-direction:column;text-align:center}
    .btn-book{width:100%}
    .cover{width:clamp(110px,34vw,140px)}
  }
  @media (max-width:560px){
    .ref{padding:14px 16px 14px 16px;padding-top:68px}
    .ref::before{left:16px;top:14px}
    .btn-end{width:100%}
  }

  :focus-visible{outline:3px solid #d9b030;outline-offset:2px}

  @media (max-width:520px){
    .panel{border-radius:28px}
    .panel .corner{width:60px;height:60px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<noscript><p style="visibility:visible;padding:24px;color:#20261c;background:#fff">ต้องเปิดใช้งาน JavaScript เพื่อใช้งานหน้านี้</p></noscript>

<div class="bg" id="bg" aria-hidden="true"></div>

<div class="shell">
  <main class="content">
    <section class="panel" aria-labelledby="pageTitle">
      <span class="corner tl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
      <header>
        <div class="head-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h6M10 12h6M10 16h4M3 7h3M3 12h3M3 17h3"/></svg>
        </div>
        <h1 id="pageTitle">เอกสารอ้างอิง</h1>
        <span class="bar"></span>
        <p class="lead">แหล่งข้อมูลและสื่อประกอบการเรียนรู้</p>
      </header>

      <div class="ref-wrap">
        <section class="book" aria-label="หนังสือเรียน">
          <div class="cover"><img id="coverImg" alt="ปกหนังสือเรียนเทคโนโลยี (การออกแบบและเทคโนโลยี) ชั้นมัธยมศึกษาปีที่ 2"></div>
          <div class="book-info">

/* ★ ปุ่ม "จบบทเรียน": true = ออกจากระบบแล้วกลับหน้าแรก | false = กลับหน้าแรกโดยไม่ออกจากระบบ */
const END_SIGN_OUT = true;

/* ★ แหล่งข้อมูลเพิ่มเติม (ใส่ url ถ้าต้องการให้มีลิงก์ใต้รายการ) */
const REFERENCES = [
  { title:"การเปลี่ยนแปลงของเทคโนโลยี",
    text:"สถาบันส่งเสริมการสอนวิทยาศาสตร์และเทคโนโลยี. (2562). เทคโนโลยี (การออกแบบและเทคโนโลยี) ชั้นมัธยมศึกษาปีที่ 2. กรุงเทพฯ: โรงพิมพ์ สกสค. ลาดพร้าว.", url:"" },
  { title:"การเลือกใช้เทคโนโลยีอย่างสร้างสรรค์",
    text:"ศูนย์เทคโนโลยีสารสนเทศและการสื่อสาร. (ม.ป.ป.). ความรู้เกี่ยวกับเทคโนโลยีและการเปลี่ยนแปลง. สืบค้นเมื่อ 10 มกราคม 2567.", url:"" },
  { title:"เทคโนโลยีการจัดการขยะและสิ่งแวดล้อม",
    text:"กรมควบคุมมลพิษ. (2565). รายงานสถานการณ์มลพิษของประเทศไทย. กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม.", url:"" }
];

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   ด่านตรวจ: ไม่ล็อกอิน = เด้งกลับหน้าแรกทันที (ไม่แสดงเนื้อหา)
   ========================================================= */
function kickOut(){ location.replace(LOGIN_PAGE); }

async function guard(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { kickOut(); return null; }
    return session;
  }catch(e){ kickOut(); return null; }
}

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") kickOut(); });
window.addEventListener("pageshow", e => { if (e.persisted) { document.documentElement.classList.remove("ok"); guard().then(s => s && document.documentElement.classList.add("ok")); } });

const toast = (() => { let t; return msg => { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 2200); }; })();

/* =========================================================
   แสดงเนื้อหา
   ========================================================= */
function render(){
  $("bookTitle").textContent = MAIN_BOOK.title;
  $("bookSub").textContent   = MAIN_BOOK.sub;
  $("bookOrg").textContent   = MAIN_BOOK.org;

  const img = $("coverImg");
  img.onerror = () => { img.onerror = null; img.src = COVER_FALLBACK; };
  img.src = MAIN_BOOK.cover;

  const btn = $("bookBtn");
  if (MAIN_BOOK.url) btn.href = MAIN_BOOK.url;
  else btn.addEventListener("click", e => { e.preventDefault(); toast("ยังไม่ได้ใส่ลิงก์หนังสือเรียน"); });

  const ul = $("refList"); ul.innerHTML = "";
  REFERENCES.forEach(r => {
    const li = document.createElement("li"); li.className = "ref";
    const h = document.createElement("h3"); h.textContent = r.title;
    const p = document.createElement("p");  p.textContent = r.text;
    li.append(h, p);
    if (r.url){
      const a = document.createElement("a");
      a.className = "lnk"; a.href = r.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = r.url;
      li.appendChild(a);
    }
    ul.appendChild(li);
  });
}

$("endBtn").onclick = async () => {
  if (!confirm("ต้องการจบบทเรียนใช่หรือไม่?")) return;
  if (END_SIGN_OUT) { try { await sb.auth.signOut(); } catch(e){} }
  kickOut();
};

/* =========================================================
   เริ่มทำงาน
   ========================================================= */
(async () => {
  const session = await guard();
  if (!session) return;

  render();
  document.documentElement.classList.add("ok");      // ผ่านด่านแล้ว ค่อยแสดงหน้า

})();
</script>
