<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข้อสอบหลังเรียน | การเปลี่ยนแปลงของเทคโนโลยี</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ซ่อนทั้งหน้าไว้ก่อน จนกว่าจะตรวจแล้วว่าล็อกอินอยู่ (กันคนเปิดไฟล์ตรงๆ เห็นเนื้อหา) */
  html:not(.ok) body{visibility:hidden}

  :root{
    --ink:#ffffff;
    --ink-soft:rgba(255,255,255,.78);
    --cyan:#b9e36f;
    --blue:#2b7a2f;
    --gold:#ffd43b;
    --glass:rgba(255,255,255,.14);
    --glass-line:rgba(255,255,255,.34);
    --navy:#0f2a17;
    --nav-w:290px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,#2f86d9 0%,#7cbcf0 42%,#6cbf45 72%,#3f8f2a 100%);
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- พื้นหลัง (ชุดเดียวกับหน้าแรก) ---------- */
  .bg{position:fixed;inset:0;z-index:-1;background:#0f2a17;overflow:hidden}
  .bg img,.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bg video{opacity:0;transition:opacity .8s ease}
  .bg video.ready{opacity:1}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,20,40,.4),rgba(0,20,40,.3) 50%,rgba(0,20,40,.5))}

  /* ---------- แถบบน ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:14px;
    padding:12px clamp(14px,3vw,32px);
    padding-top:max(12px,env(safe-area-inset-top));
    background:linear-gradient(180deg,rgba(10,40,20,.55),rgba(10,40,20,.35));
    -webkit-backdrop-filter:blur(16px) saturate(130%);backdrop-filter:blur(16px) saturate(130%);
    border-bottom:1px solid var(--glass-line);
  }
  .burger{
    display:none;width:44px;height:44px;flex:none;border-radius:50%;cursor:pointer;
    background:var(--glass);border:1px solid var(--glass-line);place-items:center;
  }
  .burger svg{width:22px;height:22px;stroke:#fff;stroke-width:2.2;stroke-linecap:round;fill:none}
  .brand{
    flex:1;min-width:0;
    font-family:"Fredoka","Mitr","Noto Sans Thai",sans-serif;font-weight:600;
    font-size:clamp(.95rem,2.2vw,1.2rem);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 10px rgba(0,30,60,.45);
  }
  .brand small{display:block;font-family:"Inter","Noto Sans Thai",sans-serif;font-weight:300;font-size:.74rem;color:var(--ink-soft)}
  .user{display:flex;align-items:center;gap:10px;flex:none}
  .user .who{
    display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:99px;
    background:var(--glass);border:1px solid var(--glass-line);font-size:.88rem;max-width:230px;
  }
  .user .who .dot{
    width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:rgba(185,227,111,.22);border:1.5px solid var(--cyan);
  }
  .user .who .dot svg{width:16px;height:16px;fill:#fff}
  .user .who span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logout{
    height:40px;padding:0 18px;border-radius:99px;cursor:pointer;font-weight:500;font-size:.88rem;
    background:rgba(255,255,255,.1);border:1px solid var(--glass-line);
    transition:background .2s,border-color .2s;
  }
  .logout:hover{background:rgba(255,255,255,.22);border-color:var(--gold);color:var(--gold)}

  /* ---------- โครงหน้า ---------- */
  .shell{
    max-width:1320px;margin:0 auto;
    padding:clamp(16px,3vw,32px) clamp(14px,3vw,32px) 40px;
    display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);gap:clamp(16px,2.6vw,30px);
    align-items:start;
  }

  /* ---------- เมนูข้าง ---------- */
  .nav{
    position:sticky;top:96px;
    max-height:calc(100vh - 120px);overflow-y:auto;
    padding:16px 12px;border-radius:28px;
    background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
    border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(22px) saturate(130%);backdrop-filter:blur(22px) saturate(130%);
    box-shadow:0 24px 60px rgba(0,25,55,.35),inset 0 1px 0 rgba(255,255,255,.4);
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent;
  }
  .nav h2{
    font-family:"Fredoka","Mitr","Noto Sans Thai",sans-serif;font-size:1.15rem;font-weight:600;
    padding:4px 12px 12px;
  }
  .nav ul{list-style:none}
  .nav li+li{margin-top:4px}

  .item,.group-btn{
    width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    min-height:48px;padding:8px 12px;border-radius:18px;cursor:pointer;
    background:transparent;border:1px solid transparent;
    font-size:.95rem;font-weight:400;line-height:1.35;
    transition:background .18s,border-color .18s;
  }
  .item:hover,.group-btn:hover{background:rgba(255,255,255,.14)}
  .no{
    flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:99px;
    display:grid;place-items:center;
    font-family:"Fredoka",sans-serif;font-weight:600;font-size:.88rem;
    background:rgba(255,255,255,.16);border:1px solid var(--glass-line);
  }
  .txt{flex:1;min-width:0}
  .chev{flex:none;width:18px;height:18px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:transform .25s}
  .group-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}

  .item.active{
    background:rgba(185,227,111,.2);border-color:var(--cyan);
    box-shadow:0 0 18px rgba(185,227,111,.28);font-weight:600;
  }
  .item.active .no{background:var(--cyan);border-color:var(--cyan);color:var(--navy)}

  .sub{list-style:none;margin:4px 0 6px 22px;padding-left:12px;border-left:2px solid rgba(185,227,111,.45);display:none}
  .sub.open{display:block}
  .sub .item{min-height:44px;font-size:.92rem}
  .sub .no{min-width:38px;height:30px;font-size:.8rem}

  /* ---------- เนื้อหากลางหน้า ---------- */
  .content{min-width:0}
  .panel{
    border-radius:30px;
    padding:clamp(26px,4vw,52px) clamp(20px,4.4vw,60px) clamp(28px,4vw,48px);
    background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
    border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(22px) saturate(130%);backdrop-filter:blur(22px) saturate(130%);
    box-shadow:0 24px 60px rgba(0,25,55,.35),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .panel header{text-align:center}
  .panel h1{
    font-family:"Fredoka","Mitr","Noto Sans Thai",sans-serif;
    font-size:clamp(2rem,5vw,3.2rem);font-weight:700;line-height:1.25;
    text-shadow:0 4px 24px rgba(0,30,60,.45);
  }
  .panel .bar{display:block;width:124px;height:5px;margin:16px auto 0;border-radius:99px;background:var(--cyan);box-shadow:0 0 18px rgba(185,227,111,.7)}
  .lead{
    max-width:60ch;margin:22px auto 0;text-align:center;
    font-size:clamp(1rem,2.2vw,1.2rem);font-weight:300;color:var(--ink);
    text-shadow:0 2px 12px rgba(0,30,60,.4);
  }

  .goals{list-style:none;max-width:760px;margin:30px auto 0}
  .goals li{
    display:flex;gap:16px;align-items:flex-start;
    padding:18px 4px;border-top:1px solid rgba(255,255,255,.22);
    font-size:clamp(1rem,2.1vw,1.12rem);line-height:1.65;
  }
  .goals li:last-child{border-bottom:1px solid rgba(255,255,255,.22)}
  .goals .tick{
    flex:none;width:36px;height:36px;margin-top:1px;border-radius:50%;display:grid;place-items:center;
    background:rgba(185,227,111,.2);border:1.5px solid var(--cyan);box-shadow:0 0 14px rgba(185,227,111,.4);
  }
  .goals .tick svg{width:18px;height:18px;stroke:var(--cyan);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}

  .next{max-width:760px;margin:30px auto 0;display:flex;justify-content:center}
  .btn{
    min-width:min(100%,320px);height:54px;padding:0 34px;border:0;border-radius:99px;cursor:pointer;
    font-weight:600;font-size:1.02rem;color:#fff;
    background:linear-gradient(90deg,var(--blue),#5aa83a);
    box-shadow:0 10px 24px rgba(43,122,47,.45);
    transition:transform .15s,box-shadow .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(43,122,47,.55)}

  footer{margin-top:28px;text-align:center;font-size:.82rem;color:rgba(255,255,255,.75)}

  /* ---------- หน้าทำข้อสอบ ---------- */
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .qno{
    font-family:"Fredoka","Mitr","Noto Sans Thai",sans-serif;font-weight:700;
    font-size:1.25rem;line-height:1.2;color:var(--cyan);
    text-shadow:0 3px 18px rgba(0,30,60,.45);
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .pts{
    flex:none;padding:6px 18px;border-radius:99px;
    background:var(--gold);color:var(--navy);font-weight:700;font-size:.95rem;
    box-shadow:0 6px 16px rgba(255,212,59,.35);
  }
  .progress{display:flex;align-items:center;gap:12px;margin-top:14px}
  .progress .track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .progress .fill{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .5s cubic-bezier(.4,.2,.2,1)}
  .progress .txt{flex:none;font-size:.85rem;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .qtext{
    margin-top:22px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.28);
    font-size:clamp(1.12rem,2.6vw,1.5rem);font-weight:500;line-height:1.65;
    text-shadow:0 2px 12px rgba(0,30,60,.4);
  }
  .choices{margin-top:22px;display:grid;gap:12px}
  .choice{
    position:relative;display:flex;align-items:center;gap:16px;
    min-height:62px;padding:12px 20px 12px 14px;border-radius:20px;cursor:pointer;
    font-size:clamp(1rem,2.1vw,1.12rem);line-height:1.5;
    background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);
    transition:background .18s,border-color .18s,box-shadow .18s,transform .12s;
  }
  .choice:hover{background:rgba(255,255,255,.24)}
  .choice:active{transform:scale(.995)}
  .choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .choice:focus-within{outline:3px solid var(--gold);outline-offset:2px}
  .choice .lt{
    flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    font-family:"Mitr","Noto Sans Thai",sans-serif;font-weight:600;font-size:1.05rem;
    background:rgba(255,255,255,.16);border:1px solid var(--glass-line);
    transition:background .18s,color .18s,border-color .18s;
  }
  .choice .ct{flex:1;min-width:0}
  .choice.sel{background:rgba(185,227,111,.24);border-color:var(--cyan);box-shadow:0 0 22px rgba(185,227,111,.32)}
  .choice.sel .lt{background:var(--cyan);border-color:var(--cyan);color:var(--navy)}
  .actions{margin-top:clamp(26px,3.6vw,36px);display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
  .actions .btn,.btn-ghost{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-width:230px;height:54px;padding:0 30px;border-radius:99px;cursor:pointer;
    font-weight:600;font-size:1.02rem;
  }
  .actions svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .btn-ghost{
    color:#fff;background:rgba(255,255,255,.1);border:1px solid var(--glass-line);
    transition:background .2s,border-color .2s,color .2s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.22);border-color:var(--gold);color:var(--gold)}
  @media (max-width:600px){
    .actions{flex-direction:column-reverse;align-items:stretch}
    .actions .btn,.btn-ghost{min-width:0;width:100%}
    .choice{padding:10px 14px 10px 10px;gap:12px}
    .choice .lt{width:36px;height:36px}
  }

  /* ---------- ผลคะแนน ---------- */
  .panel[hidden]{display:none}
  .result{text-align:center}
  .rbadge{
    width:clamp(84px,12vw,104px);height:clamp(84px,12vw,104px);margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
    background:rgba(185,227,111,.2);border:2px solid var(--cyan);box-shadow:0 0 34px rgba(185,227,111,.45);
  }
  .rbadge svg{width:52%;height:52%;stroke:var(--cyan);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .rtitle{font-family:"Fredoka","Mitr","Noto Sans Thai",sans-serif;font-weight:700;font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.35;text-shadow:0 3px 16px rgba(0,30,60,.4)}
  .rlabel{margin-top:26px;font-size:1rem;color:var(--ink-soft)}
  .rscore{font-family:"Fredoka","Mitr",sans-serif;font-weight:700;font-size:clamp(3.2rem,11vw,5.2rem);line-height:1.1;color:var(--gold);text-shadow:0 4px 20px rgba(0,30,60,.35)}
  .rscore small{font-size:.42em;font-weight:500;color:var(--ink-soft)}
  .rtrack{width:min(100%,420px);height:12px;margin:10px auto 0;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .rtrack span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .9s cubic-bezier(.4,.2,.2,1)}
  .rnote{max-width:52ch;margin:20px auto 0;font-size:clamp(.98rem,2vw,1.08rem);line-height:1.7;text-shadow:0 2px 12px rgba(0,30,60,.4)}

  /* ---------- แจ้งเตือนสั้นๆ ---------- */
  .toast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:60;
    transform:translate(-50%,20px);opacity:0;pointer-events:none;
    max-width:min(92vw,420px);padding:12px 22px;border-radius:99px;text-align:center;font-size:.92rem;
    background:rgba(15,42,23,.92);border:1px solid var(--gold);color:var(--gold);
    transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* ---------- มือถือ/แท็บเล็ต: เมนูเลื่อนออกจากด้านซ้าย ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,20,40,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}

  @media (max-width:900px){
    .burger{display:grid}
    .shell{grid-template-columns:1fr}
    .nav{
      position:fixed;z-index:50;top:0;left:0;bottom:0;
      width:min(86vw,330px);max-height:none;border-radius:0 28px 28px 0;
      padding-top:max(16px,env(safe-area-inset-top));
      background:linear-gradient(160deg,rgba(18,58,32,.97),rgba(30,84,44,.95));
      transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,.2,.2,1);
    }
    .nav.open{transform:none}
    .user .who{display:none}
  }
  @media (max-width:520px){
    .brand small{display:none}
    .logout{padding:0 14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<noscript><p style="visibility:visible;padding:24px;color:#fff;background:#0f2a17">ต้องเปิดใช้งาน JavaScript เพื่อใช้งานหน้านี้</p></noscript>

<div class="bg" id="bg" aria-hidden="true">
  <img id="bgImg" alt="" hidden>
  <video id="bgVideo" muted loop playsinline preload="auto" disablepictureinpicture hidden></video>
</div>

<div class="topbar">
  <button class="burger" id="burger" type="button" aria-label="เปิดเมนู" aria-controls="nav" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">แอปพลิเคชันแบบสถานการณ์จำลอง<small>เรื่อง การเปลี่ยนแปลงของเทคโนโลยี</small></div>
  <div class="user">
    <div class="who" title="ผู้ใช้งาน">
      <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg></span>
      <span class="n" id="userName">...</span>
    </div>
    <button class="logout" id="logout" type="button">ออกจากระบบ</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="nav" id="nav" aria-label="เมนูการใช้งาน">
    <h2>เมนูการใช้งาน</h2>
    <ul id="menu"></ul>
  </nav>

  <main class="content">
    <section class="panel" id="quizPanel" aria-labelledby="qNo" hidden>
      <div class="qhead">
        <h1 class="qno" id="qNo">ข้อที่ 1</h1>
        <span class="pts" id="qPts">1 คะแนน</span>
      </div>
      <p class="sr">แบบทดสอบหลังเรียน</p>
      <div class="progress" aria-hidden="true">
        <div class="track"><span class="fill" id="progFill"></span></div>
        <span class="txt" id="progTxt">1 / 10</span>
      </div>

      <p class="qtext" id="qText"></p>
      <div class="choices" id="choices" role="radiogroup" aria-labelledby="qText"></div>

      <div class="actions">
        <button class="btn-ghost" id="goPrev" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>ทบทวนข้อก่อนหน้า
        </button>
        <button class="btn" id="goNext" type="button"><span id="nextLbl">ข้อถัดไป</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="nextPath" d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <section class="panel result" id="resultPanel" aria-labelledby="rTitle" hidden>
      <div class="rbadge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 class="rtitle" id="rTitle">ทำแบบทดสอบหลังเรียนเสร็จแล้ว</h2>
      <span class="bar"></span>
      <p class="rlabel">คะแนนของคุณ</p>
      <p class="rscore"><span id="rScore">0</span><small> / <span id="rTotal">10</span></small></p>
      <div class="rtrack" aria-hidden="true"><span id="rBar"></span></div>
      <p class="rnote" id="rNote"></p>
      <p class="rnote" id="rCompare" hidden></p>
      <div class="actions">
        <a class="btn-ghost" href="decision2.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>กลับสู่การตัดสินใจ บทที่ 2
        </a>
        <button class="btn" id="goLesson" type="button"><span>ดูสรุปผลคะแนน</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   พื้นหลัง — ใส่ค่าให้เหมือนกับที่ตั้งไว้ใน index.html
   ========================================================= */

  for (const m of MENU){ if (m.id === id) return m; for (const c of (m.children||[])) if (c.id === id) return c; }

function showResult(score, total, already){
  $("quizPanel").hidden = true; $("resultPanel").hidden = false;

  $("rNote").textContent = already
    ? "คุณทำแบบทดสอบหลังเรียนไปแล้ว นี่คือคะแนนที่บันทึกไว้ในระบบ"
    : "ระบบบันทึกคะแนนหลังเรียนของคุณเรียบร้อยแล้ว";
  showCompare(score, total);
  requestAnimationFrame(() => { $("rBar").style.width = (total ? Math.round(score / total * 100) : 0) + "%"; });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* เปรียบเทียบกับคะแนนก่อนเรียน (ถ้ามี) */
async function showCompare(score, total){
  try{
    const { data } = await sb.from("quiz_results").select("score,total").eq("quiz", "pretest").maybeSingle();
    if (!data) return;
    const d = score - data.score, el = $("rCompare");
    el.textContent = "คะแนนก่อนเรียน " + data.score + " / " + data.total + "  →  หลังเรียน " + score + " / " + total + "  " +
      (d > 0 ? "(เพิ่มขึ้น " + d + " คะแนน)" : d === 0 ? "(เท่าเดิม)" : "(ต่ำกว่าก่อนเรียน " + (-d) + " คะแนน ลองทบทวนบทเรียนอีกครั้ง)");
    el.hidden = false;
  }catch(e){}
}

async function loadExisting(){
  const { data } = await sb.from("quiz_results").select("score,total").eq("quiz", QUIZ_ID).maybeSingle();
  if (data) showResult(data.score, data.total, true); else render(false);
}

async function submitQuiz(){
  if (sending) return;
  for (let i = 0; i < TOTAL; i++) {
    if (answers[i] === undefined) { toast("ยังไม่ได้ตอบข้อที่ " + (i + 1)); cur = i; render(true); return; }
  }
  sending = true; $("goNext").disabled = true; $("nextLbl").textContent = "กำลังบันทึก...";
  const payload = {};
  for (let i = 0; i < TOTAL; i++) payload[i + 1] = answers[i];

  const { data, error } = await sb.rpc("submit_quiz", { p_quiz: QUIZ_ID, p_answers: payload });
  sending = false; $("goNext").disabled = false; updateNext();

  if (error) {
    const m = error.message || "";
    if (m.includes("already_submitted")) { await loadExisting(); return; }
    if (m.includes("not_authenticated")) { kickOut(); return; }
    toast(m.includes("no_key") ? "ยังไม่ได้ใส่เฉลยในระบบ แจ้งผู้สอน" : "บันทึกคะแนนไม่สำเร็จ กรุณาลองอีกครั้ง");
    return;
  }
  try { sessionStorage.removeItem(ANSWER_KEY); } catch (e) {}
  answers = {};
  showResult(data.score, data.total, false);
}

};
$("goNext").onclick = () => {
  if (answers[cur] === undefined) { toast("กรุณาเลือกคำตอบก่อนไปข้อถัดไป"); return; }
  if (cur + 1 < TOTAL) { cur++; render(true); }
  else submitQuiz();
};

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;                           // ด่านตรวจด้านบนจะเด้งออกให้เอง
  ANSWER_KEY = "posttest_answers_" + session.user.id;
  try { answers = JSON.parse(sessionStorage.getItem(ANSWER_KEY) || "{}"); } catch (e) {}
  await loadExisting();
})();

/* ออกจากระบบ */
$("logout").onclick = async () => { await sb.auth.signOut(); kickOut(); };

/* =========================================================
   เริ่มทำงาน
   ========================================================= */
(async () => {
  const session = await guard();
  if (!session) return;

  buildMenu();
  document.documentElement.classList.add("ok");      // ผ่านด่านแล้ว ค่อยแสดงหน้า

  const meta = session.user.user_metadata || {};
  $("userName").textContent = meta.full_name || meta.username || "ผู้ใช้งาน";
  if (!meta.full_name){
    const { data:p } = await sb.from("profiles").select("full_name").eq("id", session.user.id).maybeSingle();
    if (p && p.full_name) $("userName").textContent = p.full_name;
  }
})();
</script>
