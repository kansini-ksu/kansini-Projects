<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข้อสอบหลังเรียน | การเปลี่ยนแปลงของเทคโนโลยี</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ซ่อนทั้งหน้าไว้ก่อน จนกว่าจะตรวจแล้วว่าล็อกอินอยู่ (กันคนเปิดไฟล์ตรงๆ เห็นเนื้อหา) */
  html:not(.ok) body{visibility:hidden}

  :root{
    /* โทนสีอิงจากหน้า index, situation2 และ decision1: เหลืองสด + หมึกเขียวเข้ม + ครีม */
    --ink:#20261c;
    --ink-soft:#666b5c;
    --y:#f4d24f;
    --y-hi:#f9e27a;
    --y-edge:#d1a922;
    --line:#ebe7d2;
    --card-edge:#e3dfc9;
    --glass:rgba(255,255,255,.76);
    --nav-w:292px;
    --pad:clamp(14px,2.4vw,28px);
    --ok:#2f7d45;
    --ok-bg:#eafaf1;
    --ok-edge:#256637;
    --danger:#c0392b;
    --danger-bg:#fdf0ed;
    --danger-edge:#962d22;
    --i-arrow:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%2320261c'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M5%2012h14'/%3E%3Cpath%20d='m12%205%207%207-7%207'/%3E%3C/svg%3E");
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Prompt","Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);min-height:100vh;
    background:#fbfaf2;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- พื้นหลัง (ชุดเดียวกับหน้า index และ situation2) ---------- */
  .bg{
    position:fixed;inset:0;z-index:-1;
    background:
      linear-gradient(180deg,rgba(252,251,244,.58) 0%,rgba(251,250,240,.62) 55%,rgba(255,249,224,.58) 100%),
      url("img/bg-science.png") center/cover no-repeat,
      linear-gradient(160deg,#fcfbf4 0%,#fbfaf0 55%,#fff7d6 100%);
    overflow:hidden;
  }

  /* ---------- ปุ่มเมนูลอย (มือถือ/แท็บเล็ต) ---------- */
  .burger{
    display:none;position:fixed;z-index:45;
    top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
    width:50px;height:50px;border:0;border-radius:17px;cursor:pointer;place-items:center;
    background:linear-gradient(180deg,#f9e27a,#f1cb43);
    box-shadow:0 4px 0 var(--y-edge),0 14px 24px -10px rgba(120,95,10,.55),inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s,box-shadow .15s;
  }
  .burger:active{transform:translateY(3px);box-shadow:0 1px 0 var(--y-edge)}
  .burger svg{width:24px;height:24px;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;fill:none}

  /* ---------- โครงหน้า: เมนูอยู่ฝั่งขวา ---------- */
  .shell{
    max-width:1360px;margin:0 auto;
    padding:var(--pad) clamp(14px,3vw,32px) 40px;
    display:grid;grid-template-columns:minmax(0,1fr) var(--nav-w);gap:clamp(16px,2.4vw,28px);
    align-items:start;
    transition:grid-template-columns .3s cubic-bezier(.4,.2,.2,1);
  }
  .content{grid-column:1;grid-row:1;min-width:0}
  .nav{grid-column:2;grid-row:1}

  /* ---------- เมนูข้าง ---------- */
  .nav{
    position:sticky;top:var(--pad);
    max-height:calc(100vh - var(--pad)*2);max-height:calc(100dvh - var(--pad)*2);
    display:flex;flex-direction:column;
    padding:14px;border-radius:30px;
    background:#fff;
    border:2px solid #f0ecd6;
    box-shadow:0 6px 0 var(--card-edge),0 30px 50px -26px rgba(190,150,20,.45);
  }

  /* หัวเมนู: โลโก้ + ชื่อแอป */
  .nav-head{display:flex;align-items:center;gap:8px;padding:2px 0 14px}
  .brand{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
  .logo{
    width:44px;height:44px;flex:none;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);
    transform:rotate(-6deg);
  }
  .logo svg{width:23px;height:23px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .brand-txt{min-width:0;font-weight:600;font-size:.9rem;line-height:1.3;color:var(--ink)}
  .brand-txt small{display:block;margin-top:3px;font-weight:400;font-size:.72rem;line-height:1.35;color:var(--ink-soft)}
  .round-btn{
    flex:none;width:34px;height:34px;border-radius:14px;cursor:pointer;display:grid;place-items:center;
    background:#fff;border:2px solid #f0ecd6;box-shadow:0 3px 0 var(--card-edge);
    transition:background .18s,border-color .18s;
  }
  .round-btn:hover{background:#fff7d0;border-color:var(--y)}
  .round-btn svg{width:17px;height:17px;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:transform .3s}
  .close-btn{display:none}

  /* การ์ดผู้ใช้ */
  .who{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 12px 8px 8px;border-radius:20px;
    background:#fff;border:2px solid #f0ecd6;box-shadow:0 4px 0 var(--card-edge);
  }
  .who .dot{
    width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);box-shadow:inset 0 2px 0 rgba(255,255,255,.6);
  }
  .who .dot svg{width:18px;height:18px;fill:var(--ink)}
  .who-txt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .who .n{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{font-size:.72rem;font-weight:400;color:var(--ink-soft)}

  /* รายการเมนู */
  .nav-scroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    margin:0 -8px;padding:0 8px 6px;
    scrollbar-width:thin;scrollbar-color:#e3dba6 transparent;
  }
  .nav h2{padding:2px 12px 8px;font-size:.76rem;font-weight:500;color:var(--ink-soft)}
  .nav ul{list-style:none}
  .nav li+li{margin-top:5px}

  .item,.group-btn{
    width:100%;display:flex;align-items:center;gap:11px;text-align:left;
    min-height:50px;padding:6px 10px;border-radius:20px;cursor:pointer;
    background:#fff;border:2px solid #f0ecd6;
    font-size:.92rem;font-weight:500;line-height:1.35;color:var(--ink);
    box-shadow:0 4px 0 var(--card-edge);
    transition:transform .15s,box-shadow .15s,background .18s,border-color .18s;
  }
  .item:hover,.group-btn:hover{background:#fffbe8;border-color:var(--y);transform:translateY(-1px);box-shadow:0 5px 0 var(--card-edge)}
  .item:active,.group-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--card-edge)}
  .no{
    flex:none;min-width:32px;height:32px;padding:0 7px;border-radius:12px;display:grid;place-items:center;
    font-weight:600;font-size:.82rem;color:var(--ink);
    background:#faf8ec;border:1.5px solid #ece8d0;
  }
  .txt{flex:1;min-width:0}
  .chev{flex:none;width:18px;height:18px;stroke:var(--ink-soft);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:transform .25s}
  .group-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}

  /* หน้าที่เปิดอยู่ */
  .item.active{
    background:linear-gradient(180deg,#f9e27a,#f1cb43);border-color:#f1cb43;font-weight:600;
    box-shadow:0 4px 0 var(--y-edge),0 14px 22px -12px rgba(190,150,20,.75);
  }
  .item.active:hover{transform:none;box-shadow:0 4px 0 var(--y-edge),0 14px 22px -12px rgba(190,150,20,.75)}
  .item.active .no{background:#fff;border-color:#fff}

  .sub{list-style:none;margin:3px 0 5px 14px;padding-left:8px;border-left:0;display:none}
  .sub.open{display:block}
  .sub .item{min-height:44px;font-size:.88rem;font-weight:400}
  .sub .item.active{font-weight:600}
  .sub .no{min-width:36px;height:28px;font-size:.76rem}

  /* ท้ายเมนู: ออกจากระบบ */
  .nav-foot{flex:none;margin-top:8px;padding-top:12px;border-top:1.5px solid var(--line)}
  .logout{
    width:100%;height:46px;padding:0 14px;border-radius:20px;cursor:pointer;
    display:flex;align-items:center;gap:11px;font-weight:500;font-size:.92rem;
    background:#fff;border:2px solid #f0ecd6;box-shadow:0 4px 0 var(--card-edge);
    transition:background .18s,border-color .18s,box-shadow .18s;
  }
  .logout svg{width:19px;height:19px;flex:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .logout:hover{background:#fff7d0;border-color:var(--y);box-shadow:0 4px 0 var(--y-edge)}

  /* ---------- การ์ดหลัก (เอฟเฟกต์เดียวกับ situation2) ---------- */
  .panel{
    position:relative;isolation:isolate;overflow:hidden;
    border-radius:34px;border:2px solid transparent;
    padding:clamp(26px,4vw,52px) clamp(20px,4.4vw,60px) clamp(28px,4vw,48px);
    background:
      linear-gradient(160deg,#ffffff,#fffefa 55%,#fffbe6) padding-box,
      linear-gradient(135deg,#ffffff,#f3d65e 48%,#e6dfbb) border-box;
    box-shadow:0 8px 0 var(--card-edge),0 40px 70px -30px rgba(230,185,40,.65);
    animation:panelIn .9s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .panel[hidden]{display:none}
  @keyframes panelIn{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(12px)}}
  .panel>*{position:relative;z-index:1}
  .panel .corner{
    position:absolute;z-index:0;width:84px;height:84px;pointer-events:none;opacity:.9;
  }
  .panel .corner.tl{left:0;top:0;clip-path:polygon(0 0,100% 0,0 100%);background:linear-gradient(135deg,#fbe786,#f0c63a)}
  .panel .corner.br{right:0;bottom:0;clip-path:polygon(100% 100%,100% 0,0 100%);background:linear-gradient(135deg,#40463a,#1a1d15)}
  .panel::before{
    content:"";position:absolute;z-index:0;left:50%;top:-60px;width:420px;height:300px;margin-left:-210px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(244,210,79,.5),rgba(244,210,79,0) 70%);
    animation:corePulse 4s ease-in-out infinite;
  }
  @keyframes corePulse{50%{transform:scale(1.15)}}
  .panel::after{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(105deg,transparent 32%,rgba(244,210,79,.3) 48%,rgba(255,255,255,.85) 52%,transparent 68%);
    transform:translateX(-120%);animation:sheenX 1.3s 1s ease-in-out forwards,sheenLoop 7s 5s ease-in-out infinite;
  }
  @keyframes sheenX{to{transform:translateX(120%)}}
  @keyframes sheenLoop{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}

  /* ---------- หัวข้อหลักของการ์ด ---------- */
  .panel header{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
  .head-icon{
    width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 6px 0 var(--y-edge),0 20px 28px -10px rgba(190,150,20,.6),inset 0 2px 0 rgba(255,255,255,.6);
    transform:rotate(-6deg);animation:floaty 4.5s ease-in-out infinite;
  }
  .head-icon svg{width:40px;height:40px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
  .chip-lesson{
    display:inline-block;margin-bottom:14px;padding:6px 18px;border-radius:99px;
    font-weight:600;font-size:.88rem;background:#fff;border:2px solid #f0ecd6;box-shadow:0 3px 0 var(--card-edge);
  }
  .panel h1{
    font-family:"Prompt","Noto Sans Thai",sans-serif;
    font-size:clamp(2rem,5vw,3.2rem);font-weight:700;line-height:1.3;letter-spacing:-.3px;color:var(--ink);
    display:inline-block;padding:.02em .36em .1em;
    background:linear-gradient(180deg,#f9e27a,#f1cb43);border-radius:.3em;transform:rotate(-1.5deg);
    box-shadow:0 .09em 0 var(--y-edge),0 18px 26px -12px rgba(190,150,20,.6);
    animation:hlPop .8s .35s cubic-bezier(.34,1.5,.64,1) backwards;
  }
  @keyframes hlPop{from{transform:rotate(-6deg) scale(.6);opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}}
  .panel .bar{
    display:block;width:110px;height:9px;margin:16px auto 0;border-radius:99px;
    background:linear-gradient(180deg,#f9e27a,#f1cb43);box-shadow:0 3px 0 var(--y-edge);
    animation:barGrow .9s .5s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes barGrow{from{width:0;opacity:0}}
  .lead{
    display:block;width:fit-content;max-width:60ch;margin:22px auto 0;padding:8px 26px;border-radius:99px;
    font-size:clamp(1rem,2.2vw,1.15rem);font-weight:400;color:var(--ink-soft);text-align:center;
    background:rgba(255,255,255,.9);border:2px solid #f0ecd6;box-shadow:0 4px 0 var(--card-edge);
    animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) backwards;
  }

  /* ---------- บล็อกเนื้อหา & โจทย์การตัดสินใจ ---------- */
  .block{margin-top:clamp(30px,4.2vw,48px)}
  .bh{display:flex;align-items:center;gap:14px}
  .bh .bn{
    flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;
    background:linear-gradient(145deg,#fbe786,#efc83f);box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-6deg);
  }
  .bh h2{font-size:clamp(1.3rem,2.8vw,1.7rem);font-weight:700;line-height:1.35;color:var(--ink)}
  .hint{margin:8px 0 18px 60px;font-size:.95rem;color:var(--ink-soft)}
  @media (max-width:600px){.hint{margin-left:0}}

  .box{padding:clamp(18px,3vw,30px);border-radius:28px;background:#fff;border:2px solid #f0ecd6;box-shadow:0 6px 0 var(--card-edge)}
  .story{animation:rise .9s .3s cubic-bezier(.2,.8,.2,1) backwards}
  .story-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .story-head .si{
    flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 4px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-6deg);
  }
  .story-head .si svg{width:28px;height:28px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .story h3{font-size:clamp(1.15rem,2.4vw,1.4rem);font-weight:700;line-height:1.4;color:var(--ink)}
  .story p{max-width:68ch;font-size:clamp(1rem,2vw,1.06rem);line-height:1.85;color:var(--ink-soft)}
  .story p + p{margin-top:10px}
  .watch{
    margin-top:18px;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:22px;
    background:#fffbe8;border:2px solid #f3e49a;box-shadow:0 4px 0 #eadb8a;
  }
  .watch .wi{
    flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(145deg,#fbe786,#efc83f);
    box-shadow:0 3px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.6);
  }
  .watch .wi svg{width:21px;height:21px;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .watch p{margin-top:4px;color:var(--ink);font-size:1rem;line-height:1.75}

  /* ---------- ตัวเลือกการตัดสินใจ (ก, ข, ค) ---------- */
  .choices{display:grid;gap:14px;animation:rise .9s .42s cubic-bezier(.2,.8,.2,1) backwards}
  .choice{
    position:relative;display:flex;align-items:center;gap:16px;
    min-height:70px;padding:14px 22px 14px 16px;border-radius:24px;cursor:pointer;
    font-size:clamp(1rem,2.1vw,1.1rem);line-height:1.55;color:var(--ink);
    background:#fff;border:2px solid #f0ecd6;
    box-shadow:0 5px 0 var(--card-edge);
    transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s,background .18s;
  }
  .choice:hover{
    transform:translateY(-3px);background:#fffbe8;border-color:var(--y);
    box-shadow:0 8px 0 var(--card-edge),0 20px 30px -16px rgba(190,150,20,.45);
  }
  .choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--card-edge)}
  .choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .choice:focus-within{outline:3px solid #d9b030;outline-offset:2px}
  .choice .lt{
    flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
    font-weight:700;font-size:1.05rem;color:var(--ink);
    background:#faf8ec;border:1.5px solid #ece8d0;
    box-shadow:0 3px 0 var(--card-edge);
    transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .18s;
  }
  .choice .ct{flex:1;min-width:0;font-weight:500}
  /* สถานะเมื่อเลือกข้อนั้น */
  .choice.sel{
    background:linear-gradient(180deg,#fffef5,#fff6c7);
    border-color:var(--y-edge);
    box-shadow:0 6px 0 var(--y-edge),0 18px 28px -14px rgba(190,150,20,.6);
  }
  .choice.sel .lt{
    background:linear-gradient(145deg,#fbe786,#efc83f);
    border-color:var(--y-edge);
    box-shadow:0 3px 0 var(--y-edge),inset 0 2px 0 rgba(255,255,255,.65);
    transform:rotate(-4deg) scale(1.04);
  }
  .choice.sel .ct{font-weight:600}
  @media (max-width:600px){
    .choice{padding:12px 16px 12px 12px;gap:12px;border-radius:20px}
    .choice .lt{width:38px;height:38px;border-radius:12px}
  }

  /* ---------- ปุ่มควบคุมด้านล่าง ---------- */
  .actions{margin-top:clamp(28px,3.6vw,40px);display:flex;flex-wrap:wrap;justify-content:center;gap:16px;animation:rise .9s .55s cubic-bezier(.2,.8,.2,1) backwards}
  .btn,.btn-ghost{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-width:240px;height:56px;padding:0 30px;border-radius:22px;cursor:pointer;
    font-weight:700;font-size:1.02rem;text-decoration:none;
  }
  .btn{
    border:0;color:var(--ink);
    background:linear-gradient(180deg,#f9e27a,#f1cb43);
    box-shadow:0 6px 0 var(--y-edge),0 18px 28px -10px rgba(190,150,20,.65),inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s,filter .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--y-edge),0 24px 32px -10px rgba(190,150,20,.75),inset 0 2px 0 rgba(255,255,255,.65)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--y-edge),0 6px 12px -6px rgba(190,150,20,.6),inset 0 2px 0 rgba(255,255,255,.5)}
  .btn:disabled{cursor:wait;opacity:.8;transform:translateY(3px);box-shadow:0 3px 0 var(--y-edge)}
  .btn svg,.btn-ghost svg{width:19px;height:19px;flex:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}

  .btn-ghost{
    color:var(--ink);background:#fff;border:2px solid #f0ecd6;box-shadow:0 5px 0 var(--card-edge);
    transition:transform .15s,box-shadow .15s,background .2s,border-color .2s;
  }

  /* ---------- หน้าผลการตัดสินใจ (แสดงหลังตอบถูก หรือเคยทำไปแล้ว) ---------- */

  /* ---------- แจ้งเตือนสั้นๆ (Toast) ---------- */
  .toast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;

  /* ---------- หน้าทำข้อสอบ ---------- */

<script>
/* =========================================================
   ตั้งค่า
   ========================================================= */
const SUPABASE_URL      = "https://bhmkjjdruckmtnkdwanc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Shzi7NdOwBdI4ijpZ4xgwA_WbUZmmZr";
const LOGIN_PAGE        = "index.html";
const CURRENT_ID        = "posttest";     // เมนูที่กำลังเปิดอยู่ในหน้านี้

/* รายการเมนู — href ว่าง = หน้ายังไม่ได้สร้าง (กดแล้วขึ้นแจ้งเตือน)
   พอสร้างหน้าไหนเสร็จ ให้ใส่ชื่อไฟล์ที่ href ของเมนูนั้น */
const MENU = [
  { id:"objective", no:"1", label:"วัตถุประสงค์",        href:"objectives.html" },
  { id:"pretest",   no:"2", label:"แบบทดสอบก่อนเรียน",   href:"pretest.html" },
  { id:"lesson1",   no:"3", label:"บทเรียนที่ 1", children:[
      { id:"l1-content",   no:"3.1", label:"เนื้อหาบทที่ 1",    href:"lesson1.html" },
      { id:"l1-situation", no:"3.2", label:"สถานการณ์ บทที่ 1", href:"situation1.html" },
      { id:"l1-decision",  no:"3.3", label:"ตัดสินใจ",           href:"decision1.html" } ]},
  { id:"lesson2",   no:"4", label:"บทเรียนที่ 2", children:[
      { id:"l2-content",   no:"4.1", label:"เนื้อหาบทที่ 2",    href:"lesson2.html" },
      { id:"l2-situation", no:"4.2", label:"สถานการณ์ บทที่ 2", href:"situation2.html" },
      { id:"l2-decision",  no:"4.3", label:"ตัดสินใจ",           href:"decision2.html" } ]},
  { id:"posttest",  no:"5", label:"แบบทดสอบหลังเรียน",   href:"posttest.html" },
  { id:"score",     no:"6", label:"สรุปผลคะแนน",         href:"score.html" },
  { id:"survey",    no:"7", label:"แบบประเมิน",          href:"survey.html" },
  { id:"credits",   no:"8", label:"ผู้จัดทำ",            href:"credits.html" }
];

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   ด่านตรวจ: ไม่ล็อกอิน = เด้งกลับหน้าแรกทันที (ไม่แสดงเนื้อหา)
   ========================================================= */
function kickOut(){ location.replace(LOGIN_PAGE); }

async function guard(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { kickOut(); return null; }
    return session;
  }catch(e){ kickOut(); return null; }
}

/* ออกจากระบบจากแท็บอื่น / กดปุ่ม Back หลังออกจากระบบ → เช็กซ้ำ */
sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") kickOut(); });
window.addEventListener("pageshow", e => { if (e.persisted) { document.documentElement.classList.remove("ok"); guard().then(s => s && document.documentElement.classList.add("ok")); } });

/* =========================================================
   เมนู
   ========================================================= */
const toast = (() => { let t; return msg => { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 2200); }; })();

function findItem(id){
  for (const m of MENU){ if (m.id === id) return m; for (const c of (m.children||[])) if (c.id === id) return c; }
}
function itemEl(m, sub){
  const a = document.createElement("a");
  a.className = "item" + (m.id === CURRENT_ID ? " active" : "");
  a.href = m.href || "#";
  a.dataset.id = m.id; a.title = m.label;
  if (m.id === CURRENT_ID) a.setAttribute("aria-current", "page");
  a.innerHTML = `<span class="no">${m.no}</span><span class="txt">${m.label}</span>`;
  return a;
}
function buildMenu(){
  const ul = $("menu");
  MENU.forEach(m => {
    const li = document.createElement("li");
    if (!m.children){ li.appendChild(itemEl(m)); ul.appendChild(li); return; }

    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "group-btn"; btn.title = m.label;
    btn.setAttribute("aria-expanded", "true");
    btn.setAttribute("aria-controls", "sub-" + m.id);
    btn.innerHTML = `<span class="no">${m.no}</span><span class="txt">${m.label}</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
    const sub = document.createElement("ul");
    sub.className = "sub open"; sub.id = "sub-" + m.id;
    m.children.forEach(c => { const l = document.createElement("li"); l.appendChild(itemEl(c, true)); sub.appendChild(l); });
    btn.onclick = () => {
      const open = sub.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
    };
    li.append(btn, sub); ul.appendChild(li);
  });

  ul.addEventListener("click", e => {
    const a = e.target.closest("a.item"); if (!a) return;
    const it = findItem(a.dataset.id);
    if (!it.href){ e.preventDefault(); toast("หน้านี้กำลังจัดทำ ยังเปิดใช้งานไม่ได้"); }
    else closeNav();
  });
}

/* เมนูมือถือ */
function openNav(){ $("nav").classList.add("open"); $("scrim").classList.add("show"); $("burger").setAttribute("aria-expanded","true"); }
function closeNav(){ $("nav").classList.remove("open"); $("scrim").classList.remove("show"); $("burger").setAttribute("aria-expanded","false"); }
$("burger").onclick = () => $("nav").classList.contains("open") ? closeNav() : openNav();
$("scrim").onclick = closeNav;
$("closeBtn").onclick = closeNav;

/* ย่อ/ขยายเมนู (เดสก์ท็อป) — จำค่าไว้ในเครื่อง */
(function(){
  const root = document.documentElement, b = $("collapseBtn");
  try{ if (localStorage.getItem("navMin") === "1") root.classList.add("nav-min"); }catch(e){}
  const sync = () => {
    const min = root.classList.contains("nav-min");
    b.setAttribute("aria-expanded", String(!min));
    b.setAttribute("aria-label", min ? "ขยายเมนู" : "ย่อเมนู");
    b.title = min ? "ขยายเมนู" : "ย่อเมนู";
  };
  b.onclick = () => {
    root.classList.toggle("nav-min");
    try{ localStorage.setItem("navMin", root.classList.contains("nav-min") ? "1" : "0"); }catch(e){}
    sync();
  };
  sync();
})();
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });

/* =========================================================
   ข้อสอบหลังเรียน — เพิ่มข้อใหม่โดยเพิ่มวัตถุ { text, points, choices } ต่อท้าย QUESTIONS

const TOTAL = QUESTIONS.length;           // จำนวนข้อ = จำนวนที่ใส่ใน QUESTIONS

let cur = 0, answers = {}, sending = false, ANSWER_KEY = "posttest_answers";
const saveAnswers = () => { try { sessionStorage.setItem(ANSWER_KEY, JSON.stringify(answers)); } catch (e) {} };

function updateNext(){
  const last = cur === TOTAL - 1;
  $("nextLbl").textContent = last ? "ส่งคำตอบ" : "ข้อถัดไป";
  $("nextPath").setAttribute("d", last ? "M5 12.5l4.5 4.5L19 7.5" : "M5 12h14M13 6l6 6-6 6");
}

function render(scroll){
  $("quizPanel").hidden = false; $("resultPanel").hidden = true;
  const q = QUESTIONS[cur];
  $("qNo").textContent  = "ข้อที่ " + (cur + 1);
  $("qPts").textContent = q.points + " คะแนน";
  $("qText").textContent = q.text;
  $("progFill").style.width = ((cur + 1) / TOTAL * 100) + "%";
  $("progTxt").textContent  = (cur + 1) + " / " + TOTAL;
  updateNext();

  const box = $("choices");
  box.innerHTML = "";
  q.choices.forEach((c, i) => {
    const lab = document.createElement("label");
    lab.className = "choice" + (answers[cur] === i ? " sel" : "");
    lab.innerHTML = '<input type="radio" name="ans" value="' + i + '"><span class="lt"></span><span class="ct"></span>';
    lab.querySelector(".lt").textContent = LETTERS[i] + ".";
    lab.querySelector(".ct").textContent = c;
    const inp = lab.querySelector("input");
    inp.checked = answers[cur] === i;
    inp.addEventListener("change", () => {
      answers[cur] = i; saveAnswers();
      box.querySelectorAll(".choice").forEach((el, n) => el.classList.toggle("sel", n === i));
    });
    box.appendChild(lab);
  });
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
}

function showResult(score, total, already){
  $("quizPanel").hidden = true; $("resultPanel").hidden = false;
  $("rScore").textContent = score; $("rTotal").textContent = total;
  $("rNote").textContent = already
    ? "คุณทำแบบทดสอบหลังเรียนไปแล้ว นี่คือคะแนนที่บันทึกไว้ในระบบ"
    : "ระบบบันทึกคะแนนหลังเรียนของคุณเรียบร้อยแล้ว";
  showCompare(score, total);
  requestAnimationFrame(() => { $("rBar").style.width = (total ? Math.round(score / total * 100) : 0) + "%"; });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* เปรียบเทียบกับคะแนนก่อนเรียน (ถ้ามี) */
async function showCompare(score, total){
  try{
    const { data } = await sb.from("quiz_results").select("score,total").eq("quiz", "pretest").maybeSingle();
    if (!data) return;
    const d = score - data.score, el = $("rCompare");
    el.textContent = "คะแนนก่อนเรียน " + data.score + " / " + data.total + "  →  หลังเรียน " + score + " / " + total + "  " +
      (d > 0 ? "(เพิ่มขึ้น " + d + " คะแนน)" : d === 0 ? "(เท่าเดิม)" : "(ต่ำกว่าก่อนเรียน " + (-d) + " คะแนน ลองทบทวนบทเรียนอีกครั้ง)");
    el.hidden = false;
  }catch(e){}
}

async function loadExisting(){
  const { data } = await sb.from("quiz_results").select("score,total").eq("quiz", QUIZ_ID).maybeSingle();
  if (data) showResult(data.score, data.total, true); else render(false);
}

async function submitQuiz(){
  if (sending) return;
  for (let i = 0; i < TOTAL; i++) {
    if (answers[i] === undefined) { toast("ยังไม่ได้ตอบข้อที่ " + (i + 1)); cur = i; render(true); return; }
  }
  sending = true; $("goNext").disabled = true; $("nextLbl").textContent = "กำลังบันทึก...";
  const payload = {};
  for (let i = 0; i < TOTAL; i++) payload[i + 1] = answers[i];

  const { data, error } = await sb.rpc("submit_quiz", { p_quiz: QUIZ_ID, p_answers: payload });
  sending = false; $("goNext").disabled = false; updateNext();

  if (error) {
    const m = error.message || "";
    if (m.includes("already_submitted")) { await loadExisting(); return; }
    if (m.includes("not_authenticated")) { kickOut(); return; }
    toast(m.includes("no_key") ? "ยังไม่ได้ใส่เฉลยในระบบ แจ้งผู้สอน" : "บันทึกคะแนนไม่สำเร็จ กรุณาลองอีกครั้ง");
    return;
  }
  try { sessionStorage.removeItem(ANSWER_KEY); } catch (e) {}
  answers = {};
  showResult(data.score, data.total, false);
}

$("goPrev").onclick = () => {
  if (cur > 0) { cur--; render(true); }
  else location.href = "posttest.html";           // ข้อที่ 1 ย้อนกลับไปหน้าคำชี้แจง
};
$("goNext").onclick = () => {
  if (answers[cur] === undefined) { toast("กรุณาเลือกคำตอบก่อนไปข้อถัดไป"); return; }
  if (cur + 1 < TOTAL) { cur++; render(true); }
  else submitQuiz();
};
$("goLesson").onclick = () => {
  const it = findItem("score");
  if (it && it.href) location.href = it.href; else toast("สรุปผลคะแนน กำลังจัดทำ ยังเปิดใช้งานไม่ได้");
};

/* เริ่มทำงาน: เก็บคำตอบชั่วคราวแยกตามผู้ใช้ แล้วเช็กว่าเคยทำแล้วหรือยัง */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;                           // ด่านตรวจด้านบนจะเด้งออกให้เอง
  ANSWER_KEY = "posttest_answers_" + session.user.id;
  try { answers = JSON.parse(sessionStorage.getItem(ANSWER_KEY) || "{}"); } catch (e) {}
  await loadExisting();
})();

/* ออกจากระบบ */
$("logout").onclick = async () => { await sb.auth.signOut(); kickOut(); };

/* =========================================================
   เริ่มทำงาน
   ========================================================= */
(async () => {
  const session = await guard();
  if (!session) return;

  buildMenu();
  document.documentElement.classList.add("ok");      // ผ่านด่านแล้ว ค่อยแสดงหน้า

  const meta = session.user.user_metadata || {};
  $("userName").textContent = meta.full_name || meta.username || "ผู้ใช้งาน";
  if (!meta.full_name){
    const { data:p } = await sb.from("profiles").select("full_name").eq("id", session.user.id).maybeSingle();
    if (p && p.full_name) $("userName").textContent = p.full_name;
  }
})();
</script>
